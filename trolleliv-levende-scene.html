<!doctype html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trolleliv – levende eventyrscene</title>
<style>
:root{--mx:0px;--my:0px}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111b;color:#fff;font-family:Georgia,serif}#world{position:fixed;inset:0;overflow:hidden;isolation:isolate;touch-action:pan-y;background:radial-gradient(ellipse at 50% 65%,#31465b,#07111b 90%)}
#scene{position:absolute;inset:-4%;transform:translate3d(calc(var(--mx)*-.22),calc(var(--my)*-.15),0) scale(1.03);transition:transform .35s ease-out;background-image:linear-gradient(180deg,#08132124,#0000 34%,#10131b24),url('trolleliv-bakgrunn.png');background-size:contain;background-repeat:no-repeat;background-position:center;filter:saturate(1.06) contrast(1.025)}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 42%,#050b15aa 100%),linear-gradient(180deg,#0a142d52,transparent 23%,transparent 76%,#070f19a8)}
#moonlight{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 30% 42% at 70% 19%,#a6c7ff18,transparent 80%);mix-blend-mode:screen}
#fireglow{position:absolute;left:50%;top:49%;width:min(42vw,480px);height:min(45vh,400px);transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(ellipse,#ffc06b2c 0%,#ffb35c16 30%,transparent 70%);mix-blend-mode:screen;animation:fire 4s ease-in-out infinite alternate;pointer-events:none}
@keyframes fire{0%{opacity:.56;transform:translate(-50%,-50%) scale(.92)}55%{opacity:1}100%{opacity:.68;transform:translate(-50%,-50%) scale(1.1)}}
#mist{position:absolute;inset:50% -30% -10%;background:radial-gradient(ellipse at 45% 80%,#c7d5e21b,transparent 64%);filter:blur(25px);animation:mist 24s ease-in-out infinite alternate;pointer-events:none}@keyframes mist{from{transform:translateX(-6%)}to{transform:translateX(7%)}}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#backSnow{opacity:.62;filter:blur(.6px)}#frontSnow{opacity:.9}
#ui{position:absolute;z-index:9;top:20px;left:20px;max-width:340px;background:#081522b9;border:1px solid #f1ce9155;box-shadow:0 16px 60px #0007;backdrop-filter:blur(15px);border-radius:15px;padding:16px 19px}h1{font-size:25px;line-height:1.1;color:#f7dba8;margin:0 0 9px;text-shadow:0 2px 15px #f8b85455}p{font:13px/1.5 system-ui;color:#e5eaf0;margin:0 0 12px}button{font:12px system-ui;cursor:pointer;border:1px solid #d9b27a99;background:#6a4529;color:#fff1d4;border-radius:9px;padding:9px 12px}button:hover{background:#805535}#note{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:9;border:1px solid #e5d6b63d;background:#091626ad;color:#f2e6d3;border-radius:25px;padding:9px 17px;font:12px system-ui;white-space:nowrap}#glints{position:absolute;inset:0;pointer-events:none;overflow:hidden}.glint{position:absolute;width:4px;height:4px;background:#ffdc8c;border-radius:50%;box-shadow:0 0 8px 3px #ffbd6d88,0 0 25px 8px #ffad4b33;animation:glint var(--duration) ease-in-out infinite alternate;animation-delay:var(--delay)}@keyframes glint{from{opacity:.08;transform:scale(.5)}to{opacity:.8;transform:scale(1.5)}}#lantern{position:absolute;bottom:9%;left:8%;width:70px;height:115px;pointer-events:none;transform:translate3d(calc(var(--mx)*.3),calc(var(--my)*.2),0);filter:drop-shadow(0 3px 10px #0009)}.lantern-top{position:absolute;top:15px;left:16px;width:38px;height:11px;background:linear-gradient(#4b3928,#171c20);border-radius:4px}.lantern-handle{position:absolute;top:0;left:26px;width:18px;height:21px;border:4px solid #302923;border-bottom:0;border-radius:15px 15px 0 0}.lantern-body{position:absolute;top:25px;left:17px;width:36px;height:57px;background:linear-gradient(90deg,#2e2925 0 12%,#ffd27e44 14% 85%,#2b2928 88%);border:5px solid #292927;border-radius:5px 5px 9px 9px;box-shadow:0 0 30px 9px #ffae5266,0 0 75px 30px #ffae521a}.lantern-flame{position:absolute;top:45px;left:31px;width:9px;height:22px;border-radius:80% 20% 65% 35%;transform:rotate(10deg);background:#ffe9a3;box-shadow:0 0 15px 7px #ffc65d;animation:flame 1.7s ease-in-out infinite alternate}@keyframes flame{to{transform:rotate(-12deg) scale(.8,1.12);opacity:.75}}.lantern-base{position:absolute;top:82px;left:13px;width:44px;height:10px;background:#292727;border-radius:3px}
@media(max-width:650px){#ui{top:8px;left:8px;right:8px;max-width:none;padding:10px 12px}h1{font-size:20px}#ui p{font-size:11px;margin-bottom:8px}#note{font-size:10px;bottom:10px}#lantern{transform:scale(.7);transform-origin:bottom left;bottom:5%;left:3%}#scene{background-size:cover}}
</style></head>
<body><main id="world"><div id="scene"></div><div id="moonlight"></div><div id="fireglow"></div><canvas id="backSnow"></canvas><div id="mist"></div><div id="glints"></div><div id="lantern"><div class="lantern-handle"></div><div class="lantern-top"></div><div class="lantern-body"></div><div class="lantern-flame"></div><div class="lantern-base"></div></div><canvas id="frontSnow"></canvas><div id="vignette"></div>
<section id="ui"><h1>✧ Trolleliv våkner</h1><p>En 2,5D-prøve med den originale illustrasjonen, snø i flere dybdelag, varmt lykte- og vinduslys, svevende glimt og forsiktig kamerabevegelse.</p><button id="toggle">Sett scenen i ro</button> <button id="night">Demp lyset</button></section><div id="note">Beveg musen forsiktig · Se snøen og lyset leve</div></main>
<script>
const world=document.getElementById('world'),back=document.getElementById('backSnow'),front=document.getElementById('frontSnow'),glints=document.getElementById('glints');let w=innerWidth,h=innerHeight,dpr=Math.min(devicePixelRatio,1.7),running=true,dim=false,flakesA=[],flakesB=[];
let seed=123987;function rand(){seed=(Math.imul(1664525,seed)+1013904223)>>>0;return seed/4294967296}
function create(n,near){return Array.from({length:n},()=>({x:rand()*w,y:rand()*h,r:(near?1.6:.65)+rand()*(near?2.5:1.1),speed:(near?35:12)+rand()*(near?75:30),drift:(rand()-.5)*(near?28:12),phase:rand()*6.28,alpha:(near?.4:.22)+rand()*.45}))}
function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio,1.7);for(const c of [back,front]){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);c.getContext('2d').setTransform(dpr,0,0,dpr,0,0)}flakesA=create(150,false);flakesB=create(100,true)}
resize();addEventListener('resize',resize);
for(let i=0;i<28;i++){const g=document.createElement('span');g.className='glint';g.style.left=(12+rand()*76)+'%';g.style.top=(20+rand()*68)+'%';g.style.setProperty('--duration',(1.5+rand()*4)+'s');g.style.setProperty('--delay',(-rand()*6)+'s');g.style.opacity='.3';glints.append(g)}
let last=performance.now();function draw(canvas,arr,dt,t){const ctx=canvas.getContext('2d');ctx.clearRect(0,0,w,h);for(const p of arr){if(running){p.y+=p.speed*dt;p.x+=(p.drift+Math.sin(t*.0004+p.phase)*6)*dt;if(p.y>h+8){p.y=-8;p.x=rand()*w}if(p.x>w+8)p.x=-8;if(p.x< -8)p.x=w+8}ctx.beginPath();ctx.fillStyle='rgba(245,249,255,'+p.alpha+')';ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}}function frame(now){let dt=Math.min((now-last)/1000,.05);last=now;draw(back,flakesA,dt,now);draw(front,flakesB,dt,now);requestAnimationFrame(frame)}requestAnimationFrame(frame);
let mx=0,my=0;world.addEventListener('pointermove',e=>{if(!running)return;mx=(e.clientX/w-.5)*22;my=(e.clientY/h-.5)*16;world.style.setProperty('--mx',mx+'px');world.style.setProperty('--my',my+'px')});
document.getElementById('toggle').onclick=e=>{running=!running;e.target.textContent=running?'Sett scenen i ro':'La scenen leve';document.querySelectorAll('.glint').forEach(g=>g.style.animationPlayState=running?'running':'paused');document.getElementById('fireglow').style.animationPlayState=running?'running':'paused';document.getElementById('mist').style.animationPlayState=running?'running':'paused';document.querySelector('.lantern-flame').style.animationPlayState=running?'running':'paused'};
document.getElementById('night').onclick=e=>{dim=!dim;document.getElementById('fireglow').style.opacity=dim?'.12':'';document.getElementById('lantern').style.opacity=dim?'.22':'1';document.getElementById('glints').style.opacity=dim?'.1':'1';e.target.textContent=dim?'Tenn lyset':'Demp lyset'};
</script></body></html>
