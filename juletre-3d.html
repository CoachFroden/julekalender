<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trolleliv – Magisk juletre</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#060d1c;color:#fff;font-family:Georgia,serif}#view{width:100%;height:100%;touch-action:none}#panel{position:absolute;top:20px;left:20px;z-index:2;background:#071224b8;border:1px solid #e6bd7255;border-radius:14px;padding:15px 19px;backdrop-filter:blur(12px);max-width:310px}h1{font-size:25px;color:#f6d69a;margin:0 0 8px}p{font:13px/1.5 system-ui;color:#dce7f5;margin:0 0 12px}button{border:1px solid #c8a46e;background:#694428;color:#fff0d0;border-radius:8px;padding:9px 13px;cursor:pointer;font-size:13px}#tip{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:#081427aa;padding:9px 15px;border-radius:30px;font:12px system-ui;white-space:nowrap;color:#dce7f5}@media(max-width:600px){#panel{top:8px;left:8px;right:8px;padding:10px;max-width:none}h1{font-size:20px}#tip{font-size:10px}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><div id="panel"><h1>✧ Et magisk juletre</h1><p>Ekte 3D, levende lys, glødende stjerne og fallende snø. Dra for å rotere treet.</p><button id="mode">✨ Magisk lys: På</button> <button id="reset">↺ Kamera</button></div><div id="view"></div><div id="tip">Dra for å rotere · Rull for å zoome</div><script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
const root=document.getElementById('view'),scene=new THREE.Scene();scene.background=new THREE.Color(0x060d1c);scene.fog=new THREE.FogExp2(0x060d1c,.028);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,120);camera.position.set(9,6.2,13);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;root.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,4.4,0);controls.enableDamping=true;controls.minDistance=7;controls.maxDistance=27;controls.maxPolarAngle=Math.PI*.52;controls.update();
scene.add(new THREE.HemisphereLight(0xadc9ff,0x152c25,1.8));const key=new THREE.DirectionalLight(0xb6d1ff,2.5);key.position.set(-8,15,8);scene.add(key);
const floor=new THREE.Mesh(new THREE.CircleGeometry(23,96),new THREE.MeshStandardMaterial({color:0xb1c5df,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.04;scene.add(floor);
const tree=new THREE.Group();scene.add(tree);
const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22,.38,8.1,12),new THREE.MeshStandardMaterial({color:0x4a2617,roughness:1}));trunk.position.y=4;tree.add(trunk);
let seed=123456;function rand(){seed=(1664525*seed+1013904223)>>>0;return seed/4294967296}const green=[0x082e26,0x104535,0x14533c,0x1b6244,0x0b3c33].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.94,side:THREE.DoubleSide}));
const cone=new THREE.ConeGeometry(1,1,7);cone.translate(0,.5,0);
for(let layer=0;layer<16;layer++){let y=.65+layer*.48,r=3.05*(1-layer/17),n=Math.round(18+layer*.8);for(let i=0;i<n;i++){let a=i*Math.PI*2/n+layer*.45;let spread=r*(.64+rand()*.34);let h=.95+rand()*.55;let branch=new THREE.Mesh(cone,green[Math.floor(rand()*green.length)]);branch.scale.set(.44+rand()*.22,h,.55+rand()*.25);branch.position.set(Math.cos(a)*spread,y,Math.sin(a)*spread);branch.rotation.z=Math.cos(a)*.35;branch.rotation.x=-Math.sin(a)*.35;tree.add(branch)}}
for(let i=0;i<9;i++){let h=1.5+i*.75,r=2.9*(1-h/9.3);const tip=new THREE.Mesh(new THREE.ConeGeometry(r,1.7,18),green[i%green.length]);tip.position.y=h;tree.add(tip)}
const ballGeo=new THREE.SphereGeometry(1,12,10),ornamentColors=[0xc92736,0xe9b752,0xf4e3c0,0x7ba8c8,0xb94a67];for(let i=0;i<145;i++){let y=1+rand()*7.45,r=3.04*(1-y/9.4)*(.95+rand()*.1),a=rand()*Math.PI*2;let m=new THREE.MeshStandardMaterial({color:ornamentColors[Math.floor(rand()*ornamentColors.length)],metalness:.72,roughness:.19});let b=new THREE.Mesh(ballGeo,m);b.scale.setScalar(.09+rand()*.09);b.position.set(Math.cos(a)*r,y,Math.sin(a)*r);tree.add(b)}
const bulbs=[],lightColors=[0xffc36b,0xffefb5,0xf87557,0x86c8ff,0xffdc85];const bulbGeo=new THREE.SphereGeometry(.07,8,8);
for(let i=0;i<260;i++){let y=.95+rand()*7.7,r=3.05*(1-y/9.5)*1.05,a=rand()*Math.PI*2,c=lightColors[i%lightColors.length];let m=new THREE.MeshBasicMaterial({color:c,transparent:true});let b=new THREE.Mesh(bulbGeo,m);b.position.set(Math.cos(a)*r,y,Math.sin(a)*r);tree.add(b);bulbs.push({m,phase:rand()*6.28,speed:.8+rand()*2.4,base:.5+rand()*.5})}
function starShape(){const s=new THREE.Shape();for(let i=0;i<10;i++){let a=i*Math.PI/5-Math.PI/2,r=i%2?.26:.61,x=Math.cos(a)*r,y=Math.sin(a)*r;i?s.lineTo(x,y):s.moveTo(x,y)}s.closePath();return s}
const starGeo=new THREE.ExtrudeGeometry(starShape(),{depth:.13,bevelEnabled:true,bevelSize:.07,bevelThickness:.07,bevelSegments:2});starGeo.center();const star=new THREE.Mesh(starGeo,new THREE.MeshBasicMaterial({color:0xffd88b}));star.position.y=9.45;tree.add(star);const starLight=new THREE.PointLight(0xffd68b,18,8);starLight.position.set(0,9.5,0);scene.add(starLight);
const count=850,positions=new Float32Array(count*3),speeds=[];for(let i=0;i<count;i++){positions[i*3]=(rand()-.5)*38;positions[i*3+1]=rand()*18;positions[i*3+2]=(rand()-.5)*38;speeds.push(.3+rand()*.9)}const snowGeo=new THREE.BufferGeometry();snowGeo.setAttribute('position',new THREE.BufferAttribute(positions,3));scene.add(new THREE.Points(snowGeo,new THREE.PointsMaterial({color:0xeaf4ff,size:.085,transparent:true,opacity:.8,depthWrite:false})));
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.75,.4,.72);composer.addPass(bloom);
let magic=true;document.getElementById('mode').onclick=()=>{magic=!magic;bloom.strength=magic?.75:0;document.getElementById('mode').textContent=magic?'✨ Magisk lys: På':'✨ Magisk lys: Av'};document.getElementById('reset').onclick=()=>{camera.position.set(9,6.2,13);controls.target.set(0,4.4,0);controls.update()};
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime(),dt=Math.min(clock.getDelta(),.04);for(const b of bulbs){let f=.67+.33*Math.sin(t*b.speed+b.phase);b.m.opacity=magic?f:1}star.rotation.y=t*.25;starLight.intensity=magic?15+5*Math.sin(t*1.6):10;for(let i=0;i<count;i++){positions[i*3+1]-=speeds[i]*.012;positions[i*3]+=.0015*Math.sin(t+i);if(positions[i*3+1]<0)positions[i*3+1]=18}snowGeo.attributes.position.needsUpdate=true;tree.rotation.y=Math.sin(t*.12)*.025;controls.update();composer.render()}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});
</script></body></html>
