<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trolleliv – 3D-eksperiment</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1727;color:#fff;font-family:Georgia,serif}canvas{display:block}#stage{height:100dvh;width:100%;position:relative}#ui{position:absolute;z-index:2;top:16px;left:16px;max-width:330px;background:#101a2ad9;border:1px solid #dba85b66;border-radius:14px;padding:16px;backdrop-filter:blur(10px)}h1{margin:0 0 7px;color:#f4c783;font-size:25px}p{font:14px/1.5 system-ui;margin:8px 0}button,a{background:#6e4328;color:#ffeac0;border:1px solid #bd8e53;border-radius:8px;padding:9px 12px;font:14px system-ui;cursor:pointer}a{display:inline-block;text-decoration:none;margin-top:6px}#msg{color:#ffe4ad;min-height:20px}#hint{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);background:#101a2ab9;border-radius:20px;padding:10px 16px;font:13px system-ui;white-space:nowrap}@media(max-width:600px){#ui{right:12px;left:12px;top:10px;padding:10px}h1{font-size:20px}#hint{font-size:11px}}</style></head><body><div id="stage"><div id="ui"><h1>✦ Trolleliv i ekte 3D</h1><p>Et separat teknologieksperiment. Dra for å rotere, bruk musehjul for å zoome, og trykk på en luke.</p><button id="reset">Nullstill kamera</button> <a href="/">Til kalenderen</a><p id="msg">Velg en av de lysende lukene.</p></div><div id="hint">Dra for å se huset fra ulike vinkler · Klikk på en luke</div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/controls/OrbitControls.js';
const stage=document.getElementById('stage'),scene=new THREE.Scene();scene.background=new THREE.Color('#15243b');scene.fog=new THREE.FogExp2('#15243b',.024);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,180);camera.position.set(11,9,17);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.6;stage.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,3,0);controls.minDistance=7;controls.maxDistance=32;controls.maxPolarAngle=Math.PI*.48;controls.update();
scene.add(new THREE.HemisphereLight('#a8c9ff','#6c4c30',2.3));const moon=new THREE.DirectionalLight('#d6e5ff',2.6);moon.position.set(-8,15,7);moon.castShadow=true;moon.shadow.mapSize.set(1024,1024);scene.add(moon);
const mat=(c,r=1)=>new THREE.MeshStandardMaterial({color:c,roughness:r});const wood=mat('#8f302b'),trim=mat('#5c2a1e'),roof=mat('#e8edf4'),doorMat=mat('#714124'),gold=mat('#f6bb66'),snow=mat('#f4f8ff');
function box(w,h,d,m,x,y,z,parent=scene){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
box(100,.3,100,snow,0,-.25,0);box(9,6,6,wood,0,3,0);
const roofGroup=new THREE.Group();scene.add(roofGroup);for(const s of [-1,1]){let r=box(6.9,.35,7,roof,s*2.3,7.45,0);r.rotation.z=s*.67}box(9.8,.3,7.3,roof,0,6.15,0);
for(let i=0;i<5;i++){box(.14,5.7,.17,trim,-4+i*2,3,3.1);box(.14,5.7,.17,trim,-4+i*2,3,-3.1)}
const doors=[],clock=new THREE.Clock();let active=null;
for(let row=0;row<3;row++)for(let col=0;col<4;col++){const x=-3.15+col*2.1,y=1.55+row*1.75,z=3.11;
box(1.35,1.38,.08,trim,x,y,z);const glow=new THREE.Mesh(new THREE.PlaneGeometry(1.18,1.22),new THREE.MeshBasicMaterial({color:'#ffb85b',transparent:true,opacity:.17}));glow.position.set(x,y,z+.055);scene.add(glow);
const hinge=new THREE.Group();hinge.position.set(x-.61,y,z+.13);scene.add(hinge);const slab=box(1.2,1.25,.13,doorMat,.6,0,.07,hinge);slab.userData.door=doors.length;const knob=new THREE.Mesh(new THREE.SphereGeometry(.065,10,8),gold);knob.position.set(1.04,0,.18);hinge.add(knob);knob.userData.door=doors.length;doors.push({hinge,slab,glow,angle:0,target:0,number:doors.length+1})}
for(let x of [-3.4,3.4]){const lamp=new THREE.PointLight('#ffac50',22,7,2);lamp.position.set(x,4,3.8);scene.add(lamp);const bulb=new THREE.Mesh(new THREE.SphereGeometry(.13,12,10),new THREE.MeshBasicMaterial({color:'#ffe3a2'}));bulb.position.copy(lamp.position);scene.add(bulb)}
function tree(x,z,h){const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.16,.26,h*.45,8),trim);trunk.position.set(x,h*.22,z);scene.add(trunk);for(let i=0;i<3;i++){let cone=new THREE.Mesh(new THREE.ConeGeometry(h*(.27-i*.045),h*.52,8),mat('#17493f'));cone.position.set(x,h*(.45+i*.18),z);cone.castShadow=true;scene.add(cone)}}
for(let i=0;i<22;i++){let a=i*2.4,r=10+(i%4)*2;tree(Math.sin(a)*r,Math.cos(a)*r,2.4+(i%3)*.7)}
const count=450,coords=new Float32Array(count*3),velocity=new Float32Array(count);for(let i=0;i<count;i++){coords[i*3]=(Math.random()-.5)*55;coords[i*3+1]=Math.random()*17;coords[i*3+2]=(Math.random()-.5)*55;velocity[i]=.25+Math.random()*.55}
const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(coords,3));const particles=new THREE.Points(geo,new THREE.PointsMaterial({color:'#ffffff',size:.10,transparent:true,opacity:.85,depthWrite:false}));scene.add(particles);
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();renderer.domElement.addEventListener('click',e=>{if(Math.abs(e.clientX-(window._startX??e.clientX))>8)return;const r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mouse,camera);let hit=ray.intersectObjects(doors.map(d=>d.slab),false)[0];if(!hit)return;let d=doors[hit.object.userData.door];d.target=d.target===0?-1.85:0;document.getElementById('msg').textContent='Luke '+d.number+(d.target?' åpnes ✨':' lukkes');});renderer.domElement.addEventListener('pointerdown',e=>window._startX=e.clientX);
document.getElementById('reset').onclick=()=>{camera.position.set(11,9,17);controls.target.set(0,3,0);controls.update()};
function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;for(const d of doors){d.angle+=(d.target-d.angle)*Math.min(1,dt*3);d.hinge.rotation.y=d.angle;d.glow.material.opacity=.17+Math.abs(d.angle)*.35}for(let i=0;i<count;i++){coords[i*3+1]-=velocity[i]*dt;if(coords[i*3+1]<0)coords[i*3+1]=17;coords[i*3]+=.08*dt}geo.attributes.position.needsUpdate=true;controls.update();renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
