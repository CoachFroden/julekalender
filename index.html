<!doctype html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trolleliv – Julekalenderen</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101d35;color:#fff;font-family:Georgia,serif}.scene{position:relative;width:min(100%,1600px);aspect-ratio:16/10;margin:auto;overflow:hidden;background:radial-gradient(ellipse at 25% 30%,#bd7e56 0%,#25385a 55%,#101827 100%);background-image:url('/trolleliv-bakgrunn.png');background-size:100% 100%;background-position:center}.scene:after{content:"";pointer-events:none;position:absolute;inset:0;background:linear-gradient(transparent 65%,#07132260)}h1,.subtitle{display:none}.barn{display:none;position:absolute;left:37%;top:14%;width:58%;height:75%;background:#792e26b5;clip-path:polygon(0 22%,48% 0,100% 22%,100% 100%,0 100%);border-radius:9px;box-shadow:0 0 50px #eaa24a30}.light{position:absolute;width:12px;height:17px;border-radius:50%;background:#ffd68a;box-shadow:0 0 20px 10px #ffac4b9c;animation:flicker 3.5s infinite alternate ease-in-out;pointer-events:none}.light:nth-of-type(2){animation-delay:-1.3s}.light:nth-of-type(3){animation-delay:-2.5s}@keyframes flicker{0%,100%{opacity:.72;filter:brightness(.9)}35%{opacity:.96;filter:brightness(1.15)}65%{opacity:.82;filter:brightness(1.02)}}.door{position:absolute;z-index:4;border:0;padding:0;background:transparent;cursor:pointer;perspective:900px;transform-style:preserve-3d}.door:focus-visible{outline:2px solid #ffe3a3;outline-offset:2px}.door.locked{cursor:not-allowed}.door::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 45% 62%,#b87835 0%,#6e3d1e 28%,#26170f 73%,#100c0b 100%);box-shadow:inset 0 0 10px #090605,0 0 10px 2px #e49b4a55;opacity:0;transition:opacity 1.6s}.door.open::before{opacity:1}.doorface{position:absolute;inset:0;display:block;opacity:0;backface-visibility:visible;background-image:url('/trolleliv-bakgrunn.png');background-repeat:no-repeat;transform-origin:left center;transition:transform 2.8s cubic-bezier(.25,.1,.12,1),opacity .1s;box-shadow:2px 2px 9px #120b08aa}.door.open .doorface{opacity:1;transform:rotateY(-112deg)}
.door.proof::before{border-radius:8% 7% 5% 5%;clip-path:polygon(2% 3%,96% 1%,100% 94%,87% 98%,9% 100%,0 94%);background:radial-gradient(ellipse at 60% 42%,#e0a35655 0 7%,transparent 37%),repeating-linear-gradient(90deg,#4b2b1d 0 19%,#301a12 20% 23%,#58331e 24% 45%);box-shadow:inset 0 0 13px 5px #140b08}
.door.proof .doorface{clip-path:polygon(2% 2%,97% 0,100% 94%,88% 99%,9% 100%,0 95%);border-radius:5px;box-shadow:inset -3px 0 4px #211108,3px 3px 5px #160b08}
.door.proof.open::after{content:"";position:absolute;inset:14% 18%;border-radius:50%;background:#eebc7545;filter:blur(9px);pointer-events:none;animation:gentleglow 4s ease-in-out infinite alternate}
@keyframes gentleglow{from{opacity:.25}to{opacity:.65}}.door.special .doorface{border-radius:8px}.snow{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:6}.flake{position:absolute;top:-10px;color:#fff;opacity:.65;animation:fall linear forwards}@keyframes fall{to{transform:translate3d(30px,110vh,0);opacity:0}}.overlay{position:absolute;inset:0;z-index:8;pointer-events:none;background:transparent}.panel{position:absolute;left:50%;top:48%;width:min(48vw,640px);aspect-ratio:1.72;transform:translate(-50%,-50%) scale(1);opacity:0;pointer-events:none;text-align:center;padding:0;max-width:85%;border:0;background:transparent;box-shadow:none;transition:left 4.8s cubic-bezier(.35,.1,.25,1),top 4.8s cubic-bezier(.35,.1,.25,1),transform 4.8s cubic-bezier(.35,.1,.25,1),opacity 3.3s ease}.panel.visible{opacity:1;pointer-events:auto}.panel.corner{transform:translate(-50%,-50%) scale(.68)}.panel.hidden{opacity:0;pointer-events:none}.panel.returning{opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.12)}.title-art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}.chapter-sign{position:absolute;left:30%;top:60%;width:46%;height:15%;display:grid;place-items:center;background:transparent;border:0;box-shadow:none;color:#ffe4b1;text-shadow:0 2px 3px #361309,1px 1px 0 #6c2414;font-family:Georgia,serif;font-size:clamp(15px,2.3vw,34px);white-space:nowrap}.panel button#finish{position:absolute;top:92%;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:clamp(11px,1vw,15px)}.panel button,.controls button{border:1px solid #dbb879;background:#5c3525;color:#ffe8b4;border-radius:9px;padding:10px 16px;cursor:pointer}.controls{display:flex;justify-content:center;gap:12px;align-items:center;flex-wrap:wrap;padding:12px;background:#111c2d}.controls label{font-size:14px}.hint{font-size:13px;opacity:.8}.door.locked{filter:grayscale(.75);cursor:not-allowed}.door.locked .doorface{box-shadow:none}button:focus-visible{outline:3px solid #fff}.status{font-size:13px;opacity:.8;text-align:center;padding:10px}@media(max-width:650px){.scene{aspect-ratio:3/2}.controls{font-size:13px}}\n</style></head><body><main><section class="scene" id="scene"><div class="light" style="left:34%;top:58%"></div><div class="light" style="left:68%;top:37%"></div><div class="light" style="left:89%;top:62%"></div><div id="doors"></div><div class="snow" id="snow"></div><div class="overlay" id="overlay"><div class="panel hidden" id="panel"><img class="title-art" src="/trolleliv-tittel-ren.png" alt="Trolleliv"><div class="chapter-sign" id="chapterInfo">Kapittel 2</div><button id="finish">Avslutt kapittel</button></div></div></section><div class="controls"><label><input type="checkbox" id="test" checked> Testmodus: åpne alle luker</label><button id="reset">Nullstill åpninger</button><span class="hint">Foreløpig uten lydfiler</span></div><p class="status">Testversjon: dørene bruker nå treverket fra selve illustrasjonen. Kapitlene har ennå ikke lyd.</p></main>
<script>
const doors=document.getElementById('doors'),scene=document.getElementById('scene'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel'),chapter=null,info=document.getElementById('chapterInfo'),test=document.getElementById('test');let active=null,timer=null;let completed=new Set(JSON.parse(localStorage.getItem('trolleliv-completed')||'[]'));
const entries=[
{id:'intro',label:'30. november – Eventyret begynner',x:8.3,y:33.5,w:7.7,h:19.2},
...Array.from({length:24},(_,i)=>{const col=i%4,row=Math.floor(i/4);const centersX=[52.8,60.2,68.2,76.8],centersY=[16.4,28.2,41.6,55.3,66.2,78.3];return i===0?{id:'1',label:'Luke 1',x:49.2,y:15.6,w:4.1,h:7.1}: {id:String(i+1),label:'Luke '+(i+1),x:centersX[col]-2.5,y:centersY[row]-4.3,w:5,h:8.6}}),
{id:'outro',label:'25. desember – Eventyret avsluttes',x:90.2,y:70,w:7.8,h:25}
];
function allowed(id){if(test.checked)return true;const now=new Date(),month=now.getMonth(),day=now.getDate();if(month===11){if(id==='intro')return true;if(id==='outro')return day>=24&&Array.from({length:24},(_,i)=>String(i+1)).every(x=>completed.has(x));return day>=Number(id)}if(month===10&&day===30)return id==='intro';return false}
function syncDoorImages(){const rect=scene.getBoundingClientRect();doors.querySelectorAll('.door').forEach(b=>{const face=b.querySelector('.doorface');face.style.backgroundSize=rect.width+'px '+rect.height+'px';face.style.backgroundPosition=(-b.offsetLeft)+'px '+(-b.offsetTop)+'px'})}
function draw(){doors.innerHTML='';entries.forEach(d=>{let b=document.createElement('button');b.className='door'+(allowed(d.id)?'':' locked')+((d.id==='intro'||d.id==='outro')?' special':'')+(d.id==='1'?' proof':'');b.style.cssText=`left:${d.x}%;top:${d.y}%;width:${d.w}%;height:${d.h}%`;b.setAttribute('aria-label',d.label);b.title=d.label;b.innerHTML='<span class="doorface" aria-hidden="true"></span>';b.onclick=()=>openDoor(d,b);doors.append(b)});syncDoorImages()}
window.addEventListener('resize',syncDoorImages);
let animationToken=0;
function doorOrigin(b){const sr=scene.getBoundingClientRect(),r=b.getBoundingClientRect();return {x:r.left+r.width/2-sr.left,y:r.top+r.height/2-sr.top}}
function positionPanel(x,y,scale){panel.style.left=x+'px';panel.style.top=y+'px';panel.style.transform='translate(-50%,-50%) scale('+scale+')'}
function openDoor(d,b){
 if(active||!allowed(d.id))return;
 const token=++animationToken;active={d,b,closing:false};b.classList.add('open');
 info.textContent='Kapittel '+(d.id==='intro'?1:d.id==='outro'?26:Number(d.id)+1);
 clearTimeout(timer);panel.className='panel hidden';panel.style.transition='none';
 const origin=doorOrigin(b);positionPanel(origin.x,origin.y,.12);
 setTimeout(()=>{if(token!==animationToken)return;panel.className='panel hidden';panel.style.transition='none';positionPanel(origin.x,origin.y,.12);void panel.offsetWidth;panel.style.transition='left 4.8s cubic-bezier(.35,.1,.25,1),top 4.8s cubic-bezier(.35,.1,.25,1),transform 4.8s cubic-bezier(.35,.1,.25,1),opacity 3.3s ease';panel.className='panel visible';positionPanel(scene.clientWidth*.5,scene.clientHeight*.49,1)},1600);
 timer=setTimeout(()=>{if(token!==animationToken)return;panel.className='panel visible corner';positionPanel(scene.clientWidth*.84,scene.clientHeight*.10,.68)},11600);
}
function finish(){
 if(!active||active.closing)return;
 active.closing=true;const {d,b}=active,token=++animationToken;
 clearTimeout(timer);completed.add(d.id);localStorage.setItem('trolleliv-completed',JSON.stringify([...completed]));
 const origin=doorOrigin(b);panel.className='panel visible';positionPanel(origin.x,origin.y,.12);
 setTimeout(()=>{if(token!==animationToken)return;panel.className='panel returning'},1700);
 setTimeout(()=>{if(token!==animationToken)return;b.classList.remove('open')},2150);
 setTimeout(()=>{if(token!==animationToken)return;panel.className='panel hidden';active=null;draw()},5300);
}
document.getElementById('finish').onclick=finish;document.getElementById('reset').onclick=()=>{if(active){animationToken++;active=null;panel.className='panel hidden'}completed.clear();localStorage.removeItem('trolleliv-completed');draw()};test.onchange=draw;draw();
function snowfall(){if(document.hidden)return;const snow=document.getElementById('snow');for(let i=0;i<10;i++){let s=document.createElement('span');s.className='flake';s.textContent='❄';s.style.left=Math.random()*100+'%';s.style.fontSize=(5+Math.random()*8)+'px';s.style.animationDuration=(9+Math.random()*9)+'s';s.style.animationDelay=Math.random()*4+'s';snow.append(s);setTimeout(()=>s.remove(),23000)}}snowfall();setInterval(()=>{if(Math.random()>.4)snowfall()},15000);
</script></body></html>
