<style>
*{box-sizing:border-box}body{margin:0;background:#101d35;color:#fff;font-family:Georgia,serif}.scene{position:relative;width:100%;aspect-ratio:3/2;margin:auto;overflow:hidden;background:radial-gradient(ellipse at 25% 30%,#bd7e56 0%,#25385a 55%,#101827 100%);background-image:url('/trolleliv-bakgrunn.png');background-size:100% 100%;background-position:center}.scene:after{content:"";pointer-events:none;position:absolute;inset:0;background:linear-gradient(transparent 65%,#07132260)}h1,.subtitle{display:none}.barn{display:none;position:absolute;left:37%;top:14%;width:58%;height:75%;background:#792e26b5;clip-path:polygon(0 22%,48% 0,100% 22%,100% 100%,0 100%);border-radius:9px;box-shadow:0 0 50px #eaa24a30}.light{position:absolute;width:2.1%;height:3.2%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(ellipse,#fff4c5 0%,#ffd48d77 24%,#ffb85a28 55%,transparent 75%);box-shadow:0 0 13px 5px #ffbc6545,0 0 28px 10px #ff9d3726;mix-blend-mode:screen;animation:flicker 3.5s infinite alternate ease-in-out;pointer-events:none}.light:nth-of-type(2){animation-delay:-1.3s}.light:nth-of-type(3){animation-delay:-2.5s}@keyframes flicker{0%,100%{opacity:.72;filter:brightness(.9)}35%{opacity:.96;filter:brightness(1.15)}65%{opacity:.82;filter:brightness(1.02)}}.door{position:absolute;z-index:4;border:0;padding:0;background:transparent;cursor:pointer;perspective:900px;transform-style:preserve-3d}.door:focus-visible{outline:2px solid #ffe3a3;outline-offset:2px}.door.locked{cursor:not-allowed}.door::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 45% 62%,#b87835 0%,#6e3d1e 28%,#26170f 73%,#100c0b 100%);box-shadow:inset 0 0 10px #090605,0 0 10px 2px #e49b4a55;opacity:0;transition:opacity 0s linear 2.85s}.door.open::before{opacity:1;transition:opacity 0s}.doorface{position:absolute;inset:0;display:block;opacity:1;backface-visibility:visible;background-image:url('/trolleliv-bakgrunn.png');background-repeat:no-repeat;transform-origin:left .door.standard::before{inset:8% 13% 9% 13%;border-radius:7% 8% 5% 5%;clip-path:polygon(2% 3%,97% 0,100% 95%,90% 99%,8% 100%,0 95%);background:radial-gradient(ellipse at 45% 45%,#ae79444d 0 12%,transparent 55%),repeating-linear-gradient(90deg,#4a2b1c 0 22%,#291910 23% 25%,#53301e 26% 48%);box-shadow:inset 0 0 12px 4px #120907}.door.standard .doorface{clip-path:polygon(4% 3%,96% 2%,98% 94%,91% 98%,8% 99%,2% 95%);border-radius:4px;box-shadow:inset -3px 0 5px #211108,3px 3px 5px #160b08}.door.proof::before{border-radius:8% 7% 5% 5%;inset:2% 3% 2% 3%;clip-path:polygon(5% 4%,95% 1%,100% 92%,87% 99%,10% 100%,0 93%);background:radial-gradient(ellipse at 60% 42%,#e0a35655 0 7%,transparent 37%),repeating-linear-gradient(90deg,#4b2b1d 0 19%,#301a12 20% 23%,#58331e 24% 45%);box-shadow:inset 0 0 13px 5px #140b08}
.door.proof .doorface{clip-path:polygon(8% 6%,94% 3%,97% 90%,85% 96%,12% 97%,5% 91%);border-radius:5px;box-shadow:inset -3px 0 4px #211108,3px 3px 5px #160b08}
.door.proof.open::after{content:"";position:absolute;inset:8% 9%;border-radius:20%;background:radial-gradient(ellipse at 48% 45%,#ffe7a4cf 0%,#ffc46f8a 30%,#b65d2855 66%,transparent 90%);box-shadow:0 0 18px 5px #ffb85e9c,0 0 38px 12px #ffac493d;filter:blur(5px);pointer-events:none;animation:gentleglow 3.5s ease-in-out infinite alternate}
@keyframes gentleglow{from{opacity:.25}to{opacity:.65}}.door.special .doorface{border-radius:8px}.snow{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:6}.flake{position:absolute;top:-10px;color:#fff;opacity:.65;animation:fall linear forwards}@keyframes fall{0%{transform:translate3d(0,-12px,0) rotate(-8deg);opacity:0}8%{opacity:.65}25%{transform:translate3d(15px,26vh,0) rotate(14deg)}50%{transform:translate3d(-9px,53vh,0) rotate(-12deg)}75%{transform:translate3d(25px,80vh,0) rotate(11deg);opacity:.8}100%{transform:translate3d(9px,115vh,0) rotate(-5deg);opacity:0}}.overlay{position:absolute;inset:0;z-index:8;pointer-events:none;background:transparent}.panel{position:absolute;left:50%;top:48%;width:min(37vw,490px);aspect-ratio:1.72;transform:translate(-50%,-50%) scale(1);opacity:0;pointer-events:none;text-align:center;padding:0;max-width:85%;border:0;background:transparent;box-shadow:none;transition:left 4.8s cubic-bezier(.35,.1,.25,1),top 4.8s cubic-bezier(.35,.1,.25,1),transform 4.8s cubic-bezier(.35,.1,.25,1),opacity 3.3s ease}.panel.visible{opacity:1;pointer-events:none}.panel.visible .audio-controls{pointer-events:auto}.panel.corner{transform:translate(-50%,-50%) scale(.68)}.panel.hidden{opacity:0;pointer-events:none}.panel.returning{opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.12)}.panel::before{content:"";position:absolute;z-index:-1;left:4%;right:4%;top:9%;bottom:7%;border-radius:48%;background:radial-gradient(ellipse at center,rgba(12,12,16,.64) 0%,rgba(17,13,16,.48) 42%,rgba(19,12,15,.16) 68%,transparent 84%);filter:blur(15px);pointer-events:none}.title-art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 5px 5px rgba(10,8,10,.85)) drop-shadow(0 0 12px rgba(17,10,10,.65)) drop-shadow(0 0 5px rgba(255,197,99,.20))}.chapter-sign{position:absolute;left:30%;top:60%;width:46%;height:15%;display:grid;place-items:center;background:transparent;border:0;box-shadow:none;color:#ffe4b1;text-shadow:0 2px 3px #361309,1px 1px 0 #6c2414;font-family:Georgia,serif;font-size:clamp(15px,2.3vw,34px);white-space:nowrap}.audio-controls{position:absolute;z-index:20;top:92%;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;font-size:clamp(11px,1vw,15px);pointer-events:auto}.audio-controls button{padding:7px 12px!important}.audio-controls span{display:none}.panel.visible .audio-controls{pointer-events:auto}.panel button,.controls button{border:1px solid #dbb879;background:#5c3525;color:#ffe8b4;border-radius:9px;padding:10px 16px;cursor:pointer}.controls{display:flex;justify-content:center;gap:12px;align-items:center;flex-wrap:wrap;padding:12px;background:#111c2d}.controls label{font-size:14px}.hint{font-size:13px;opacity:.8}.door.locked{filter:grayscale(.75);cursor:not-allowed}.door.locked .doorface{box-shadow:none}button:focus-visible{outline:3px solid #fff}.status{font-size:13px;opacity:.8;text-align:center;padding:10px}@media(max-width:650px){.scene{aspect-ratio:3/2}.controls{font-size:13px}}\n
/* Stille vinterliv, lagt over originalbildet */
.ambient-life{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}

.smoke-wisp:nth-child(2){animation-delay:-2.7s}.smoke-wisp:nth-child(3){animation-delay:-5.4s}
@keyframes smoke-rise{0%{opacity:0;transform:translate(0,0) scale(.55)}15%{opacity:.72}55%{opacity:.52}100%{opacity:0;transform:translate(-1.5vw,-10vw) scale(2.6)}}

.ambient-bird .bird-wings{transform-box:fill-box;transform-origin:center;animation:bird-flap .62s ease-in-out infinite alternate}
@keyframes bird-flap{from{transform:scaleY(.55)}to{transform:scaleY(1)}}
@keyframes bird-pass{0%,19%{left:18%;top:27%;opacity:0;transform:scale(.9)}21%{opacity:.48}38%{opacity:.48}41%{left:39%;top:23%;opacity:0;transform:scale(.7)}42%,100%{left:39%;top:23%;opacity:0;transform:scale(.7)}}
@media(prefers-reduced-motion:reduce){.smoke-wisp,.ambient-bird,.ambient-bird .bird-wings{animation:none;opacity:0}}
</style></head><body><main><section class="scene" id="scene"><div class="light" style="left:54%;top:30.3%"></div><div class="light" style="left:62.7%;top:17.7%"></div><div class="light" style="left:71%;top:18.8%"></div><div class="light" style="left:84.1%;top:30.9%"></div><div class="light" style="left:64%;top:52.9%"></div><div class="light" style="left:74.4%;top:42.7%"></div><div class="light" style="left:44.6%;top:53.7%"></div><div class="light" style="left:53.9%;top:43.8%"></div><div class="light" style="left:72.7%;top:74.5%"></div><div class="light" style="left:54%;top:66.9%"></div><div class="light" style="left:83%;top:69%"></div><div class="light" style="left:39.1%;top:70.5%"></div><div class="light" style="left:3.1%;top:38.2%"></div><div class="light" style="left:9.5%;top:76.1%"></div><div class="light" style="left:90.7%;top:35.3%"></div><div class="ambient-life" aria-hidden="true"><div class="chimney-smoke"><span class="smoke-wisp"></span><span class="smoke-wisp"></span><span class="smoke-wisp"></span></div><svg class="ambient-bird" viewBox="0 0 28 13" xmlns="http://www.w3.org/2000/svg"><g class="bird-wings" fill="none" stroke="#20202a" stroke-width="2.2" stroke-linecap="round"><path d="M2 3 Q8 2 14 9 Q20 2 26 3"/></g></svg></div><div id="doors"></div><div class="snow" id="snow"></div><div class="overlay" id="overlay"><div class="panel hidden" id="panel"><img class="title-art" src="/trolleliv-tittel-ren.png" alt="Trolleliv"><div class="chapter-sign" id="chapterInfo">Kapittel 2</div><div class="audio-controls" id="audioControls"><button id="toggleAudio" type="button">Pause</button><button id="closeChapter" type="button">Lukk luken</button><span id="audioStatus" role="status" aria-live="polite">Gjør klar lyden …</span></div></div></div></section><div class="controls"><label><input type="checkbox" id="test" checked> Testmodus: åpne alle luker</label><button id="reset">Nullstill åpninger</button><span class="hint">26 lydkapitler klare</span></div><p class="status">Åpne en luke for å høre dagens kapittel. Lyden starter når tittelfeltet har funnet plassen sin.</p></main>
<script>
const doors=document.getElementById('doors'),scene=document.getElementById('scene'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel'),chapter=null,info=document.getElementById('chapterInfo'),test=document.getElementById('test');let active=null,timer=null;const player=new Audio();player.preload='none';const audioToggle=document.getElementById('toggleAudio'),audioStatus=document.getElementById('audioStatus');let completed=new Set(JSON.parse(localStorage.getItem('trolleliv-completed')||'[]'));
const entries=[
{id:'intro',label:'30. november – Eventyret begynner',x:4.4,y:34.5,w:7.2,h:18.2},
{id:'1',label:'Luke 1',x:48.047,y:14.746,w:5.794,h:8.496},
{id:'2',label:'Luke 2',x:55.859,y:13.184,w:5.404,h:8.887},
{id:'3',label:'Luke 3',x:64.063,y:12.402,w:5.859,h:8.789},
{id:'4',label:'Luke 4',x:73.307,y:11.914,w:5.469,h:9.570},
{id:'5',label:'Luke 5',x:46.615,y:27.051,w:5.534,h:8.203},
{id:'6',label:'Luke 6',x:55.599,y:26.172,w:5.469,h:8.594},
{id:'7',label:'Luke 7',x:66.146,y:25.684,w:5.729,h:8.398},
{id:'8',label:'Luke 8',x:76.172,y:25.293,w:5.469,h:8.691},
{id:'9',label:'Luke 9',x:46.745,y:38.770,w:5.339,h:8.008},
{id:'10',label:'Luke 10',x:55.469,y:37.695,w:5.469,h:8.887},
{id:'11',label:'Luke 11',x:65.951,y:37.891,w:5.664,h:8.691},
{id:'12',label:'Luke 12',x:75.326,y:37.598,w:6.055,h:8.496},
{id:'13',label:'Luke 13',x:46.159,y:50.098,w:5.794,h:7.813},
{id:'14',label:'Luke 14',x:55.078,y:49.707,w:5.924,h:8.008},
{id:'15',label:'Luke 15',x:64.583,y:49.512,w:5.990,h:8.203},
{id:'16',label:'Luke 16',x:74.609,y:49.512,w:5.859,h:8.105},
{id:'17',label:'Luke 17',x:46.354,y:61.328,w:5.339,h:8.301},
{id:'18',label:'Luke 18',x:54.948,y:61.230,w:5.924,h:8.301},
{id:'19',label:'Luke 19',x:64.193,y:61.426,w:5.729,h:8.203},
{id:'20',label:'Luke 20',x:74.544,y:61.035,w:5.729,h:8.496},
{id:'21',label:'Luke 21',x:46.029,y:72.266,w:5.599,h:8.496},
{id:'22',label:'Luke 22',x:54.883,y:72.168,w:5.794,h:8.496},
{id:'23',label:'Luke 23',x:64.388,y:72.266,w:5.664,h:8.496},
{id:'24',label:'Luke 24',x:73.763,y:71.973,w:5.924,h:8.984},
{id:'outro',label:'25. desember – Eventyret avsluttes',x:91.1,y:68.8,w:6.8,h:18.5}
];
function allowed(id){if(test.checked)return true;const now=new Date(),month=now.getMonth(),day=now.getDate();if(month===11){if(id==='intro')return true;if(id==='outro')return day>=24&&Array.from({length:24},(_,i)=>String(i+1)).every(x=>completed.has(x));return day>=Number(id)}if(month===10&&day===30)return id==='intro';return false}
function syncDoorImages(){const rect=scene.getBoundingClientRect();doors.querySelectorAll('.door').forEach(b=>{const face=b.querySelector('.doorface');face.style.backgroundSize=rect.width+'px '+rect.height+'px';face.style.backgroundPosition=(-b.offsetLeft)+'px '+(-b.offsetTop)+'px'})}
function draw(){doors.innerHTML='';entries.forEach(d=>{let b=document.createElement('button');b.className='door'+(allowed(d.id)?'':' locked')+((d.id==='intro'||d.id==='outro')?' special':'')+' proof';b.style.cssText=`left:${d.x}%;top:${d.y}%;width:${d.w}%;height:${d.h}%`;b.setAttribute('aria-label',d.label);b.title=d.label;b.innerHTML='<span class="doorface" aria-hidden="true"></span>';b.onclick=()=>openDoor(d,b);doors.append(b)});syncDoorImages()}
window.addEventListener('resize',syncDoorImages);
let animationToken=0;
function doorOrigin(b){const sr=scene.getBoundingClientRect(),r=b.getBoundingClientRect();return {x:r.left+r.width/2-sr.left,y:r.top+r.height/2-sr.top}}
function positionPanel(x,y,scale){panel.style.left=x+'px';panel.style.top=y+'px';panel.style.transform='translate(-50%,-50%) scale('+scale+')'}
function audioPath(id){const n=id==='intro'?0:id==='outro'?25:Number(id);return '/'+String(n).padStart(2,'0')+'_'+(n===0?'30_november':n+'_desember')+'.mp3'}
function resetAudio(){player.pause();player.removeAttribute('src');player.load();audioToggle.textContent='Pause';audioStatus.textContent='Gjør klar lyden …'}
async function startAudio(token){if(token!==animationToken||!active||active.closing)return;audioStatus.textContent='Starter fortellingen …';try{await player.play();if(token!==animationToken){player.pause();return}audioToggle.textContent='Pause';audioStatus.textContent='Spiller av'}catch(e){if(token!==animationToken)return;audioToggle.textContent='Spill av';audioStatus.textContent='Trykk Spill av for å starte'}}
audioToggle.addEventListener('click',async e=>{e.stopPropagation();if(!active||active.closing)return;if(player.paused){try{await player.play();audioToggle.textContent='Pause';audioStatus.textContent='Spiller av'}catch(e){audioStatus.textContent='Kunne ikke starte lyden'}}else{player.pause();audioToggle.textContent='Fortsett';audioStatus.textContent='På pause'}});
player.addEventListener('ended',()=>{if(active&&!active.closing){audioStatus.textContent='Kapittelet er ferdig';finish()}});
player.addEventListener('error',()=>{if(active&&!active.closing){audioStatus.textContent='Kunne ikke laste lydfilen';audioToggle.textContent='Prøv igjen'}});
function openDoor(d,b){
 if(active||!allowed(d.id))return;
 const token=++animationToken;active={d,b,closing:false};resetAudio();player.src=audioPath(d.id);player.load();b.classList.add('open');
 info.textContent=d.id==='intro'?'Innledning':d.id==='outro'?'Avslutning':'Kapittel '+d.id;
 clearTimeout(timer);panel.className='panel hidden';panel.style.transition='none';
 const origin=doorOrigin(b);positionPanel(origin.x,origin.y,.12);
 setTimeout(()=>{if(token!==animationToken)return;panel.className='panel hidden';panel.style.transition='none';positionPanel(origin.x,origin.y,.12);void panel.offsetWidth;panel.style.transition='left 4.8s cubic-bezier(.35,.1,.25,1),top 4.8s cubic-bezier(.35,.1,.25,1),transform 4.8s cubic-bezier(.35,.1,.25,1),opacity 3.3s ease';panel.className='panel visible';positionPanel(scene.clientWidth*.5,scene.clientHeight*.49,1)},1600);
 timer=setTimeout(()=>{if(token!==animationToken)return;startAudio(token);panel.className='panel visible';setTimeout(()=>{if(token!==animationToken)return;panel.className='panel visible corner';positionPanel(scene.clientWidth*.77,scene.clientHeight*.17,.55)},5100)},6500);
}
function finish(markCompleted=true){
 if(!active||active.closing)return;
 active.closing=true;player.pause();const {d,b}=active,token=++animationToken;
 clearTimeout(timer);
 if(markCompleted){completed.add(d.id);localStorage.setItem('trolleliv-completed',JSON.stringify([...completed]));}
 // Capture the actual current screen position, then animate from there without jumping.
 const rect=panel.getBoundingClientRect(),sr=scene.getBoundingClientRect();
 const centerX=rect.left+rect.width/2-sr.left,centerY=rect.top+rect.height/2-sr.top;
 const currentScale=rect.width/panel.offsetWidth;
 panel.style.transition='none';panel.className='panel visible';
 positionPanel(centerX,centerY,currentScale);
 void panel.offsetWidth;
 const origin=doorOrigin(b);
 panel.style.transition='left 4.8s cubic-bezier(.35,.1,.25,1),top 4.8s cubic-bezier(.35,.1,.25,1),transform 4.8s cubic-bezier(.35,.1,.25,1),opacity 3.6s ease 1.1s';
 requestAnimationFrame(()=>requestAnimationFrame(()=>{if(token!==animationToken)return;positionPanel(origin.x,origin.y,.12);panel.style.opacity='0';panel.style.pointerEvents='none'}));
 // Door remains open until the entire return movement is complete.
 setTimeout(()=>{if(token!==animationToken)return;b.classList.remove('open')},5200);
 setTimeout(()=>{if(token!==animationToken)return;panel.className='panel hidden';panel.style.opacity='';panel.style.transition='';active=null;draw()},8300);
}
document.getElementById('closeChapter').addEventListener('click',e=>{e.stopPropagation();finish(false)});document.getElementById('reset').onclick=()=>{if(active){animationToken++;resetAudio();active.b.classList.remove('open');active=null;panel.className='panel hidden'}completed.clear();localStorage.removeItem('trolleliv-completed');draw()};test.onchange=draw;draw();
function snowfall(){if(document.hidden)return;const snow=document.getElementById('snow');for(let i=0;i<24;i++){let s=document.createElement('span');s.className='flake';s.textContent=Math.random()<.35?'❄':'•';s.style.left=Math.random()*100+'%';s.style.fontSize=(3+Math.random()*8)+'px';s.style.animationDuration=(13+Math.random()*16)+'s';s.style.animationDelay=Math.random()*3+'s';snow.append(s);setTimeout(()=>s.remove(),33000)}}snowfall();setInterval(snowfall,5000);
</script></body></html>
