<!doctype html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trolleliv – Julekalenderen</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101d35;color:#fff;font-family:Georgia,serif}.scene{position:relative;width:min(100%,1600px);aspect-ratio:16/10;margin:auto;overflow:hidden;background:radial-gradient(ellipse at 25% 30%,#bd7e56 0%,#25385a 55%,#101827 100%);background-image:url('/trolleliv-bakgrunn.png');background-size:cover;background-position:center}.scene:after{content:"";pointer-events:none;position:absolute;inset:0;background:linear-gradient(transparent 65%,#07132260)}h1{position:absolute;left:5%;top:5%;margin:0;color:#ffdf9b;text-shadow:0 3px 12px #160c06;font-size:clamp(24px,5vw,70px)}.subtitle{position:absolute;top:17%;left:7%;font-size:clamp(12px,2vw,28px);color:#f6d2a3}.barn{position:absolute;left:37%;top:14%;width:58%;height:75%;background:#792e26b5;clip-path:polygon(0 22%,48% 0,100% 22%,100% 100%,0 100%);border-radius:9px;box-shadow:0 0 50px #eaa24a30}.light{position:absolute;width:12px;height:17px;border-radius:50%;background:#ffd68a;box-shadow:0 0 20px 10px #ffac4b9c;animation:flicker 3.5s infinite alternate ease-in-out;pointer-events:none}.light:nth-of-type(2){animation-delay:-1.3s}.light:nth-of-type(3){animation-delay:-2.5s}@keyframes flicker{0%,100%{opacity:.72;filter:brightness(.9)}35%{opacity:.96;filter:brightness(1.15)}65%{opacity:.82;filter:brightness(1.02)}}.door{position:absolute;display:grid;place-items:center;transform-style:preserve-3d;perspective:700px;cursor:pointer;z-index:3;border:0;background:none;color:#ffe5a4;padding:0}.doorface{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(95deg,#49291b,#845032 48%,#392418);border:3px ridge #ba8553;border-radius:4px;box-shadow:inset 0 0 12px #1c0b07,0 0 12px #e8a45380;text-shadow:0 2px 4px #150600;font-size:clamp(13px,2.1vw,28px);transition:transform 2.8s cubic-bezier(.25,.1,.12,1);transform-origin:left center}.door.open .doorface{transform:rotateY(-112deg)}.door::before{content:"";position:absolute;inset:0;background:#ffc76b;box-shadow:0 0 35px 12px #ffc76b88;opacity:0;transition:opacity 1s}.door.open::before{opacity:1}.special{font-size:clamp(9px,1.2vw,17px);line-height:1.3}.special .doorface{padding:3px;text-align:center}.final{border-radius:35% 35% 5px 5px}.final .doorface{border-radius:35% 35% 5px 5px}.snow{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:6}.flake{position:absolute;top:-10px;color:#fff;opacity:.65;animation:fall linear forwards}@keyframes fall{to{transform:translate3d(30px,110vh,0);opacity:0}}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#07111b91;z-index:8;opacity:0;pointer-events:none;transition:opacity .8s}.overlay.visible{opacity:1;pointer-events:auto}.panel{text-align:center;padding:28px;max-width:85%;border:1px solid #d5b47c;background:#24190ce8;box-shadow:0 0 50px #ffc47055;border-radius:18px;transition:all 1s}.panel.corner{position:absolute;top:10px;right:10px;transform:scale(.75);transform-origin:top right;padding:12px}.panel h2{font-size:clamp(20px,3vw,40px);margin:0 0 12px}.panel button,.controls button{border:1px solid #dbb879;background:#5c3525;color:#ffe8b4;border-radius:9px;padding:10px 16px;cursor:pointer}.controls{display:flex;justify-content:center;gap:12px;align-items:center;flex-wrap:wrap;padding:12px;background:#111c2d}.controls label{font-size:14px}.hint{font-size:13px;opacity:.8}.door.locked{filter:grayscale(.75);cursor:not-allowed}.door.locked .doorface{box-shadow:none}button:focus-visible{outline:3px solid #fff}.status{font-size:13px;opacity:.8;text-align:center;padding:10px}@media(max-width:650px){.scene{aspect-ratio:4/5;background-position:55% center}.barn{left:18%;width:78%;top:20%;height:65%}h1{top:4%;font-size:30px}.subtitle{top:13%}.doorface{border-width:1px;font-size:12px}.special{font-size:9px}}
</style></head><body><main><section class="scene" id="scene"><div class="barn" aria-hidden="true"></div><h1>Trolleliv</h1><div class="subtitle">Julekalenderen</div><div class="light" style="left:34%;top:58%"></div><div class="light" style="left:68%;top:37%"></div><div class="light" style="left:89%;top:62%"></div><div id="doors"></div><div class="snow" id="snow"></div><div class="overlay" id="overlay"><div class="panel" id="panel"><h2 id="chapter">Trolleliv</h2><p id="chapterInfo">Kapittel</p><button id="finish">Avslutt kapittel</button></div></div></section><div class="controls"><label><input type="checkbox" id="test" checked> Testmodus: åpne alle luker</label><button id="reset">Nullstill åpninger</button><span class="hint">Foreløpig uten lydfiler</span></div><p class="status">Legg illustrasjonen i prosjektet som <strong>trolleliv-bakgrunn.png</strong> for å bruke det valgte motivet.</p></main>
<script>
const doors=document.getElementById('doors'),scene=document.getElementById('scene'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel'),chapter=document.getElementById('chapter'),info=document.getElementById('chapterInfo'),test=document.getElementById('test');let active=null,timer=null;let completed=new Set(JSON.parse(localStorage.getItem('trolleliv-completed')||'[]'));
const order=[7,16,3,21,10,18,1,13,22,5,19,11,2,17,8,20,4,14,23,6,12,9,15];let entries=[{id:'intro',label:'30. nov\nEventyret begynner',x:3,y:37,w:13,h:21},...order.map((n,i)=>({id:String(n),label:String(n),x:42+(i%5)*10,y:27+Math.floor(i/5)*12,w:8,h:10})),{id:'24',label:'24 ★',x:61,y:75,w:17,h:18},{id:'outro',label:'25. des\nEventyret avsluttes',x:85,y:74,w:13,h:24}];
function allowed(id){if(test.checked)return true;const now=new Date(),month=now.getMonth(),day=now.getDate();if(month===11){if(id==='intro')return true;if(id==='outro')return day>=24&&Array.from({length:24},(_,i)=>String(i+1)).every(x=>completed.has(x));return day>=Number(id)}if(month===10&&day===30)return id==='intro';return false}
function draw(){doors.innerHTML='';entries.forEach(d=>{let b=document.createElement('button');b.className='door'+(allowed(d.id)?'':' locked')+(d.id==='outro'?' final':'');b.style.cssText=`left:${d.x}%;top:${d.y}%;width:${d.w}%;height:${d.h}%`;b.setAttribute('aria-label',d.label.replace('\n',' '));b.innerHTML='<span class="doorface">'+d.label.replace('\n','<br>')+'</span>';b.onclick=()=>openDoor(d,b);doors.append(b)})}
function openDoor(d,b){if(active||!allowed(d.id))return;active={d,b};b.classList.add('open');chapter.textContent=d.id==='intro'?'Eventyret begynner':d.id==='outro'?'Eventyret avsluttes':'Trolleliv';info.textContent=d.id==='intro'?'Kapittel 1':d.id==='outro'?'Kapittel 26':'Luke '+d.id+' · Kapittel '+(Number(d.id)+1);setTimeout(()=>{overlay.classList.add('visible');panel.classList.remove('corner');timer=setTimeout(()=>panel.classList.add('corner'),3500)},900)}
function finish(){if(!active)return;clearTimeout(timer);completed.add(active.d.id);localStorage.setItem('trolleliv-completed',JSON.stringify([...completed]));overlay.classList.remove('visible');panel.classList.remove('corner');const b=active.b;active=null;setTimeout(()=>{b.classList.remove('open');setTimeout(draw,3000)},1400)}
document.getElementById('finish').onclick=finish;document.getElementById('reset').onclick=()=>{if(active)finish();completed.clear();localStorage.removeItem('trolleliv-completed');draw()};test.onchange=draw;draw();
function snowfall(){if(document.hidden)return;const snow=document.getElementById('snow');for(let i=0;i<10;i++){let s=document.createElement('span');s.className='flake';s.textContent='❄';s.style.left=Math.random()*100+'%';s.style.fontSize=(5+Math.random()*8)+'px';s.style.animationDuration=(9+Math.random()*9)+'s';s.style.animationDelay=Math.random()*4+'s';snow.append(s);setTimeout(()=>s.remove(),23000)}}snowfall();setInterval(()=>{if(Math.random()>.4)snowfall()},15000);
</script></body></html>
